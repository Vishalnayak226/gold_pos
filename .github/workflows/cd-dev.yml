name: Deploy — Development

# First stage of the dev/sandbox/live pipeline (deploy/README.md §8). Runs
# the same test gate as daily-checks.yml, then deploys the Development
# backend (branch: develop) — and the shared non-prod licensing server, only
# when licensing_server/ actually changed, since Sandbox depends on that
# same instance too.
#
# One-time setup required before this can run (see deploy/README.md §8.2-8.4):
#   - Repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
#   - Repo/environment variable: PIPELINE_DOMAIN (e.g. yourpos.com)
#   - A "development" GitHub Environment (no protection rules needed)

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    outputs:
      licensing_changed: ${{ steps.filter.outputs.licensing_server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            licensing_server:
              - 'licensing_server/**'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run all backend test suites
        working-directory: backend
        run: npm test
      - name: Install licensing_server dependencies
        working-directory: licensing_server
        run: npm ci --no-audit --no-fund
      - name: Audit backend (high+ severity fails the build)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit licensing_server (high+ severity fails the build)
        working-directory: licensing_server
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to Development
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/gold-pos/dev-backend/deploy/remote-deploy.sh \
              /opt/gold-pos/dev-backend develop backend \
              deploy/ecosystem.dev.config.cjs

      - name: Deploy non-prod licensing server (only if it changed)
        if: needs.test.outputs.licensing_changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/gold-pos/nonprod-licensing/deploy/remote-deploy.sh \
              /opt/gold-pos/nonprod-licensing develop licensing_server \
              deploy/ecosystem.licensing-nonprod.config.cjs

      - name: Smoke test
        run: |
          sleep 3
          curl -fsS "https://dev.${{ vars.PIPELINE_DOMAIN }}/api/health"
