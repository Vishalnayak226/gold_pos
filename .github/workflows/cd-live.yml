name: Deploy — Live

# Final stage of the dev/sandbox/live pipeline (deploy/README.md §8).
# Promote via a PR from staging -> main once a change has been through
# Development and manual UAT on Sandbox. The deploy job requires manual
# approval (GitHub Environment protection on "production") before it runs —
# nothing reaches Live without a human clicking Approve in the Actions tab.
#
# "Live" here is the platform owner's own pilot/production instance and the
# proven main-branch state — it does NOT auto-push to paying tenants. Tenant
# updates stay the manual per-tenant process in deploy/README.md §1-7 (or the
# existing signed security-channel auto-update, backend/updateEngine.js).
#
# One-time setup required before this can run (see deploy/README.md §8.2-8.4):
#   - Repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
#   - Repo/environment variable: PIPELINE_DOMAIN (e.g. yourpos.com)
#   - A "production" GitHub Environment with required reviewers configured
#     (Settings -> Environments -> production -> Required reviewers)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    outputs:
      licensing_changed: ${{ steps.filter.outputs.licensing_server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            licensing_server:
              - 'licensing_server/**'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run all backend test suites
        working-directory: backend
        run: npm test
      - name: Install licensing_server dependencies
        working-directory: licensing_server
        run: npm ci --no-audit --no-fund
      - name: Audit backend (high+ severity fails the build)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit licensing_server (high+ severity fails the build)
        working-directory: licensing_server
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to Live (requires manual approval)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/gold-pos/live-backend/deploy/remote-deploy.sh \
              /opt/gold-pos/live-backend main backend \
              deploy/ecosystem.live.config.cjs

      - name: Deploy production licensing server (only if it changed)
        if: needs.test.outputs.licensing_changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/gold-pos/live-licensing/deploy/remote-deploy.sh \
              /opt/gold-pos/live-licensing main licensing_server \
              deploy/ecosystem.licensing-live.config.cjs

      - name: Smoke test
        id: smoke
        continue-on-error: true # a failure here triggers the rollback steps below, not an immediate job failure
        env:
          BASE: https://app.${{ vars.PIPELINE_DOMAIN }}
        run: |
          # Poll readiness instead of sleeping a fixed 3s and hoping. /api/ready
          # answers 503 until the ledger opens and every migration this build
          # ships has been applied, so a half-deployed process fails the gate
          # here rather than passing it and serving errors to the counter.
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 5 "$BASE/api/ready"; then READY=1; break; fi
            sleep 3
          done
          if [ "${READY:-0}" != "1" ]; then
            echo "::error::$BASE/api/ready never became ready within 60s"
            curl -sS --max-time 5 "$BASE/api/ready" || true
            exit 1
          fi
          curl -fsS "$BASE/api/health"

      # -----------------------------------------------------------------------
      # Rollback (added 2026-08-19, Phase 36). Without this, a build that fails
      # the smoke test above is already live — remote-deploy.sh already did
      # `git reset --hard` and restarted pm2 before this step ever runs, so a
      # red job here previously meant "go SSH in and fix it by hand" instead of
      # "service already recovered, go read why the build failed." The backend
      # deploy step above now writes .rollback-sha (the commit it was ABOUT to
      # move off of) before every deploy; --rollback resets to exactly that.
      # This still requires the same manual "production" environment approval
      # every Live deploy already requires — rollback only reacts to a build
      # that already got that approval and then failed its own smoke test.
      # -----------------------------------------------------------------------
      - name: Roll back backend on failed smoke test
        if: steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            /opt/gold-pos/live-backend/deploy/remote-deploy.sh \
              /opt/gold-pos/live-backend main backend \
              deploy/ecosystem.live.config.cjs --rollback

      - name: Re-verify readiness after rollback, then fail the job
        if: steps.smoke.outcome == 'failure'
        env:
          BASE: https://app.${{ vars.PIPELINE_DOMAIN }}
        run: |
          # This step ONLY runs after a failed smoke test, so it always ends
          # the job red — a rollback restores service, it does not turn a bad
          # build into a good one. The point of re-polling is purely to tell
          # the difference between "rolled back cleanly, go read the smoke
          # test output above" and "rollback didn't come back either, this
          # needs a human on the VPS right now."
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 5 "$BASE/api/ready"; then READY=1; break; fi
            sleep 3
          done
          if [ "${READY:-0}" = "1" ]; then
            echo "::error::Deploy failed its post-deploy smoke test and was rolled back to the previous commit — service is restored, but this build did NOT ship. See the 'Smoke test' step above for what failed."
          else
            echo "::error::Deploy failed its post-deploy smoke test AND the rollback did not come back ready either — this needs a human on the VPS now, not just a re-run."
          fi
          exit 1
