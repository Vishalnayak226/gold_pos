name: CI — tests & security audit

# Detection only — this workflow never deploys or auto-patches anything.
# It runs the integration test suite plus a dependency vulnerability audit
# and fails loudly (visible here in the Actions tab, and to anyone with
# notifications on for this repo) if either finds something. Turning a
# finding into a shipped patch is still a human decision: fix it, review it,
# then publish it through the licensing server's release registry (see
# docs/ai_handover.md §7) — security-channel releases auto-apply to tenants
# after that; nothing here does.
#
# This is the only gate that needs NO infrastructure: it runs entirely on a
# GitHub runner, so it is green-able long before a VPS or domain exists. The
# cd-*.yml workflows re-run the same two jobs before they deploy.
#
# Triggers deliberately include pull_request on every branch. Until
# 2026-08-11 this fired only on push-to-main and the nightly cron, so on a
# repo where all work happens on feature branches and main is only ever
# fast-forwarded, the gate had never executed once.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  integration-tests:
    name: Integration test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run all backend test suites
        working-directory: backend
        run: npm test

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, licensing_server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ${{ matrix.module }} dependencies
        working-directory: ${{ matrix.module }}
        run: npm ci --no-audit --no-fund
      - name: Audit ${{ matrix.module }} (high+ severity fails the build)
        working-directory: ${{ matrix.module }}
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Security scanning (added 2026-08-17).
  #
  # Every tool below is free on a private repository and needs no GitHub
  # Advanced Security licence. That constraint drove the choices: CodeQL,
  # actions/dependency-review-action and SARIF upload all require GHAS on a
  # private repo, so none of them is used here. Dependency *vulnerability*
  # review is already covered by the `dependency-audit` job above (npm audit,
  # high+ fails), so nothing is lost by their absence.
  #
  # NONE OF THESE HAS EVER EXECUTED — like the rest of this workflow, they need
  # a pull request to be opened. Expect the first run to surface findings that
  # need triage; that is the point of the gate, not a fault in it.
  # ---------------------------------------------------------------------------

  secret-scan:
    name: Secret scan (verified credentials fail the build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TruffleHog diffs a commit range, so it needs real history rather
          # than the default depth-1 clone.
          fetch-depth: 0
      - name: Scan git history for live credentials
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        # --only-verified means a finding has been checked against the issuing
        # provider and is live. An unverified match on a test fixture or an
        # example key would otherwise redden this gate permanently, and a gate
        # that is always red is a gate nobody reads.

  static-analysis:
    name: Static analysis (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep OSS — security rulesets
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/nodejs \
            --config=p/secrets \
            --severity=ERROR \
            --error \
            --exclude=node_modules \
            --exclude=graphify-out \
            --exclude=dist \
            --exclude=backups \
            --metrics=off
        # Semgrep OSS is Apache-2.0 and runs without an account; --metrics=off
        # keeps it from phoning home. Only ERROR-severity rules fail the build:
        # WARNING and INFO are advisory on a codebase this size and would drown
        # the signal.

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, licensing_server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ${{ matrix.module }} dependencies
        working-directory: ${{ matrix.module }}
        run: npm ci --no-audit --no-fund
      - name: Generate ${{ matrix.module }} SBOM
        working-directory: ${{ matrix.module }}
        run: npm sbom --sbom-format cyclonedx > sbom-${{ matrix.module }}.cdx.json
        # `npm sbom` is built into npm 10+, so this adds no tooling and no
        # dependency — it reads the same lockfile `npm ci` just installed from.
      - name: Publish ${{ matrix.module }} SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.module }}
          path: ${{ matrix.module }}/sbom-${{ matrix.module }}.cdx.json
          retention-days: 90
